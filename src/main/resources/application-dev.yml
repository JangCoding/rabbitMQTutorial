spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # 개발 환경은 보통 update
    defer-datasource-initialization: true
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  mail:   # Gmail SMTP 설정. JavaMailSender 빈 자동구성
    host: smtp.gmail.com
    port: 587
    username: lunaeker813@gmail.com # 실제 Gmail 계정
    password: your-gmail-app-password     # Gmail 앱 비밀번호 (2단계 인증 사용 시)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000 # 연결 타임아웃 (ms)
          timeout: 5000           # 읽기/쓰기 타임아웃 (ms)
          writetimeout: 5000